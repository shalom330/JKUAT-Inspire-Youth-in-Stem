<!DOCTYPE html>
<html>
    <!--
        This is a comment in HTML
        HTML tags are not case sensitive
        tags have opening and closing tags
        <tag>content</tag>
        <html>is the root element
        <head> contains meta information
        <title> is the title of the document
        <body> contains the visible content
        <h1>-<h6> are headings
        <div> is a division or section used to divide blocks of content
        <a> is an anchor tag used to create hyperlinks
        <img> is an image tag used to display images
        <ul> is an unordered list
        <ol> is an ordered list 
        <li> is a list item
        <br> is a line break
        <button> is a button
        <form> is a form
        <footer> is a footer

            -->
    <title>HTML</title>
    <p>Welcome  to HTML</p>
    <h1>Fruits--h1</h1>
    <h2>Fruits--h2</h2>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
    </ul>
    <ol>
        <li>Apple</li>g
        <li>Banana</li>
        <li>Orange</li>
    </ol>
    <!--placing images in HTML-->
    <img src="images/meme.png" alt="meme" width="600" height="400">
    <br>
    <a href="https://instagram.com">Link for instagram</a>
    <br>
    <button>Click me</button>
    <br>
    <form action="">
        <label for="name">Name:</label>
        <input type="text" placeholder="Enter your name">
    </form>
    <br><br>
    <table>
        <tr>
            <th>Month</th>
            <th>Savings</th>
        </tr>
        <tr>
            <td>January</td>
            <td>2500</td>
        </tr>
        <tr>
            <td>Smith</td>
            <td>30</td>
        </tr>

        
    </table>

    <footer>
        <p>Footer</p>
</html>
